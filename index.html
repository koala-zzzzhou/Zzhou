<style>
:root{--ink:#243e33;--muted:#737c70;--green:#244c3c;--paper:#f6f5ef;--line:#dedfd5;--lime:#deedb4;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper);color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:11px 16px;color:var(--ink);background:#fffefa}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #a4be78;outline-offset:3px}[hidden]{display:none!important}.solid,button[aria-pressed="true"]{background:var(--green);color:white;border-color:var(--green)}header{max-width:1440px;margin:auto;padding:23px 32px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:28px Georgia,serif}header .metrics{font-size:12px;display:flex;gap:20px;color:var(--muted)}header strong{font-size:18px;color:var(--ink);margin-right:5px}main{max-width:1440px;padding:25px 32px 120px;margin:auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px;align-items:start}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}h2{font-size:18px;margin:0}h3{font-size:14px;margin:0}.pill{font-size:12px;color:var(--muted)}.direction-switch{display:flex;gap:8px;margin-bottom:16px}.direction-switch button{font-size:13px}.card{width:100%;min-height:330px;padding:35px;background:var(--green);color:#fff;border:0;display:grid;place-items:center}.card-word{font:38px/1.5 Georgia,serif;overflow-wrap:anywhere}.card-definition{font-size:28px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.card-content{max-width:100%;max-height:420px;overflow:auto}.examples{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}.lookup-credit{font-size:10px;color:var(--muted);margin-top:8px}.lookup-credit a{color:inherit}.score-panel{position:sticky;top:20px;background:#fffefa;border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}.ratings{display:grid;gap:12px}.ratings button{min-height:72px;font-size:20px}.ratings button:last-child{background:var(--lime);border-color:var(--lime)}#undo-review{font-size:12px;background:transparent}#queue-status{font-size:12px;color:var(--muted);white-space:pre-wrap}.group-grid{display:grid;gap:12px}.group-box{background:#fffefa;border:1px solid var(--line);border-radius:11px;overflow:hidden}.group-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:#e9eddf}.group-count{font-size:11px;color:var(--muted)}.group-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:7px 14px;border-top:1px solid #eeeee6;font-size:12px;line-height:1.5;align-items:start}.group-row>div{overflow-wrap:anywhere;white-space:pre-wrap}.group-row .english{display:flex;align-items:start;justify-content:space-between;gap:8px}.row-actions{display:flex;gap:5px;flex-shrink:0}.row-actions button{padding:1px 5px;font-size:11px;background:transparent;border:0;color:var(--muted)}.mastered{font-size:10px;color:#608240}.library{margin-top:28px}.tools{margin:12px 0}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:#fffefa;color:var(--ink);font-size:13px}textarea{resize:vertical;min-height:90px}label{display:block;font-size:12px;font-weight:600;margin:15px 0 7px}.empty{font-size:14px;color:var(--muted);padding:24px 0}.floating-actions{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5;padding:8px;background:#f6f5efe8;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 22px #243e3310}.floating-actions button{font-size:12px;padding:12px}.lookup-button{width:100%;margin-top:10px;background:var(--lime)}#lookup-status,#backup-status{font-size:12px;white-space:pre-wrap;margin-top:12px}.lookup-preview{font-size:12px;line-height:1.6}.lookup-preview ol{padding-left:20px}dialog{border:1px solid var(--line);border-radius:14px;padding:23px;background:var(--paper);color:var(--ink);width:min(600px,calc(100% - 24px));max-height:90dvh;overflow:auto}dialog::backdrop{background:#18302577}.dialog-header{display:flex;justify-content:space-between;align-items:center}.dialog-header button{padding:4px 10px}.side .solid{width:100%;margin-top:20px}.backup-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.backup-actions a{color:var(--ink);font-size:12px}#backup-text{min-height:180px;font:12px/1.5 monospace}#toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);padding:10px 16px;max-width:90vw;background:var(--green);color:white;font-size:12px;border-radius:8px;z-index:20}#toast:empty{display:none}.notice{padding:12px;background:#f4dfca;border-radius:8px;font-size:12px;margin-bottom:16px}
@media(min-width:1500px){.group-row{font-size:13px}}@media(max-width:640px){header{padding:18px 16px}.brand{font-size:24px}header .metrics{gap:9px;font-size:10px}header strong{font-size:15px}main{padding:20px 16px 120px}.layout{grid-template-columns:minmax(0,1fr) 100px;gap:10px}.section-head{align-items:start;flex-direction:column;gap:5px}.score-panel{padding:8px;gap:8px;top:10px}.ratings{gap:8px}.ratings button{padding:8px 3px;font-size:16px;min-height:64px}#undo-review{padding:8px 2px;font-size:10px}.direction-switch{flex-wrap:wrap}.direction-switch button{padding:8px;font-size:11px}.card{min-height:290px;padding:15px}.card-word{font-size:25px}.card-definition{font-size:20px}.group-row{font-size:11px;gap:10px;padding:7px 10px}.group-heading{padding:10px}.group-heading h3{font-size:12px}.floating-actions{gap:5px;padding:6px}.floating-actions button{padding:10px}.row-actions{gap:0}}

.layout{gap:12px 24px;align-items:stretch}.layout>section,.layout>.score-panel{display:contents}.layout>section>.section-head{grid-column:1;grid-row:1;margin:0}.direction-switch{grid-column:1;grid-row:2;margin:0}#today-preview,#card{grid-column:1;grid-row:3}#ratings{grid-column:2;grid-row:3;align-self:stretch;grid-template-rows:1fr 1fr;padding:14px;background:#fffefa;border:1px solid var(--line);border-radius:12px;gap:12px}#ratings button{height:100%;display:grid;place-items:center;font-size:22px}#undo-review{grid-column:2;grid-row:2;align-self:stretch;min-height:44px;font-size:27px;line-height:1;padding:5px 12px;background:#fffefa;border:1px solid var(--line);border-radius:10px}#queue-status{grid-column:2;grid-row:4}.layout.is-preview #ratings{align-self:start;height:330px}.layout.is-preview #queue-status{display:none}
@media(max-width:640px){.layout{gap:10px}#ratings{padding:8px;gap:8px}#ratings button{font-size:17px}#undo-review{font-size:25px;padding:5px;min-height:44px}.layout.is-preview #ratings{height:290px}}

.plan-tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.plan-tools label{display:flex;align-items:center;gap:8px;margin:0;font-size:12px;color:var(--muted)}select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#fffefa}.direction-switch{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.direction-switch button{min-width:100px}.layout.is-list{grid-template-columns:minmax(0,1fr)}.layout.is-list>section>.section-head{grid-column:1/-1}.layout.is-list #today-preview{grid-column:1/-1}#library-view{margin-top:16px}.layout:not(.is-list) #undo-review{grid-row:1}.layout:not(.is-list) .direction-switch{grid-column:1/-1}
@media(max-width:640px){.direction-switch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}.direction-switch button{min-width:0;padding:10px 2px;font-size:12px}.plan-tools{gap:8px}.layout:not(.is-list) #undo-review{grid-row:1} .plan-tools label{font-size:11px}}

.card{cursor:default}#ratings button[data-grade="good"]{background:var(--lime);border-color:var(--lime)}#ratings button[data-grade="again"]{background:#fffefa;border-color:var(--line)}
</style></head><body>
<header><div class="brand">wordwell</div><div class="metrics"><span><strong id="total">0</strong>词库</span><span><strong id="due-count">0</strong>待复习</span><span><strong id="learned">0</strong>熟记</span></div></header>
<main><div id="storage-warning" class="notice" role="alert" hidden></div>
<div class="layout"><section><div class="section-head"><h2 id="module-title">今日预览</h2><div class="plan-tools"><label id="limit-control" for="daily-limit">今日数量 <select id="daily-limit"><option value="100">100</option><option value="120">120</option><option value="140">140</option></select></label><span id="review-count" class="pill"></span></div></div><nav class="direction-switch" aria-label="单词模块"><button id="en-zh" aria-pressed="true">今日预览</button><button id="zh-en" aria-pressed="false">学习</button><button id="tab-review" aria-pressed="false">复习</button><button id="tab-library" aria-pressed="false">词库</button></nav><section id="today-preview"><div id="today-list" class="group-grid"></div></section><div id="card" class="card" role="group" aria-live="polite" aria-label="中文题面" hidden><span id="card-content" class="card-content"></span></div></section>
<aside id="score-panel" class="score-panel"><div id="ratings" class="ratings"><button data-grade="good" disabled>记得</button><button data-grade="again" disabled>不记得</button></div><div id="queue-status" role="status"></div><button id="undo-review" type="button" aria-label="撤销上次评分" title="撤销上次评分" disabled>↶</button></aside></div>
<section class="library" id="library-view" hidden><div class="section-head"><h2>词库</h2><span id="shown" class="pill"></span></div><div class="tools"><input id="search" type="search" aria-label="搜索词库" placeholder="搜索"></div><div id="list" class="group-grid"></div></section></main>
<nav class="floating-actions" aria-label="词库操作"><button id="single-import">单个导入</button><button id="import">批量导入</button><button id="export">导出</button></nav>
<dialog id="single-dialog" aria-labelledby="single-title"><div class="dialog-header"><h2 id="single-title">单个导入</h2><button id="single-close" type="button" aria-label="关闭">×</button></div><form class="side" id="add-form"><label for="word">英文</label><input id="word" required maxlength="120" autocomplete="off"><button id="lookup" class="lookup-button" type="button">查释义与例句</button><p id="lookup-status" role="status"></p><div id="lookup-preview" class="lookup-preview"></div><label for="definition">中文</label><textarea id="definition" required maxlength="2000"></textarea><label for="examples">例句</label><textarea id="examples" maxlength="4000"></textarea><div id="example-credit" hidden></div><label for="tags">单元 / 分类</label><input id="tags" maxlength="200"><button class="solid" type="submit">保存</button></form></dialog>
<dialog id="backup-dialog" aria-labelledby="backup-title"><div class="dialog-header"><h2 id="backup-title">批量导入</h2><button id="backup-close" type="button" aria-label="关闭">×</button></div><div id="bulk-unit-area"><label for="bulk-unit">单元 / 分类</label><input id="bulk-unit" maxlength="200"></div><div id="backup-file-area"><label for="backup-file">文件</label><input id="backup-file" type="file" accept=".json,.txt,.tsv,.csv,application/json,text/plain"></div><label for="backup-text">内容</label><textarea id="backup-text" spellcheck="false" placeholder="英文&#9;中文"></textarea><p id="backup-status" role="status" aria-live="polite"></p><div class="backup-actions"><a id="backup-download" download="wordwell-backup.json">下载 JSON</a><button id="backup-copy">复制</button><button id="backup-merge" class="solid">导入</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><script id="offline-seed" type="application/json">[]</script><script>

'use strict';
const KEY='wordwell.v1',DAY=86400000,INTERVALS=[1,2,4,7,15,30,60,90,180],PLAN_KEY='wordwell.daily-plan.v1',SESSION_KEY='wordwell.review-session.v2';
const $=id=>document.getElementById(id),clone=value=>JSON.parse(JSON.stringify(value));
let words=[],currentId=null,flipped=false,storageOK=true,toastTimer,backupURL=null,direction='en-zh',dailyPlan=null,session=null;
let pendingGrade=null;
const reviewHistory=[];let dailyLimit=100;try{const limit=Number(localStorage.getItem('wordwell.daily-limit'));if([100,120,140].includes(limit))dailyLimit=limit;}catch(e){}
$('daily-limit').value=String(dailyLimit);
$('daily-limit').onchange=()=>{const value=Number($('daily-limit').value);if(![100,120,140].includes(value))return;dailyLimit=value;persist('wordwell.daily-limit',dailyLimit);currentId=null;flipped=false;pendingGrade=null;render();};
try{const saved=localStorage.getItem('wordwell.module');if(['en-zh','zh-en','review','library'].includes(saved))direction=saved;}catch(e){}
function localDay(time=Date.now()){const d=new Date(time);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function midnight(time=Date.now()){const d=new Date(time);d.setHours(0,0,0,0);return d.getTime();}
function calendarDays(time,days){const d=new Date(time);d.setDate(d.getDate()+days);d.setHours(0,0,0,0);return d.getTime();}
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function valid(w){return w&&typeof w.id==='string'&&w.id.length>0&&typeof w.word==='string'&&w.word.trim().length>0&&w.word.length<=120&&typeof w.definition==='string'&&w.definition.trim().length>0&&w.definition.length<=2000&&Array.isArray(w.tags)&&w.tags.length<=20&&w.tags.every(t=>typeof t==='string'&&t.length<=200)&&Number.isInteger(w.stage)&&w.stage>=0&&w.stage<=9&&Number.isFinite(w.due)&&w.due>=0&&Number.isFinite(w.created)&&w.created>=0&&(w.examples===undefined||(Array.isArray(w.examples)&&w.examples.length<=10&&w.examples.every(t=>typeof t==='string'&&t.length<=4000)))&&(w.mastered===undefined||typeof w.mastered==='boolean')&&(w.reinforcement===undefined||w.reinforcement===null||(Number.isFinite(w.reinforcement.anchor)&&w.reinforcement.anchor>=0&&Number.isInteger(w.reinforcement.step)&&w.reinforcement.step>=0&&w.reinforcement.step<=2));}
function warn(text){$('storage-warning').hidden=false;$('storage-warning').textContent=text;}
function toast(text){$('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',3500);}
function persist(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true;}catch(e){warn('保存失败，请导出备份。');return false;}}
function save(){return storageOK&&persist(KEY,words);}
function read(){try{const raw=localStorage.getItem(KEY),data=JSON.parse(raw===null?$('offline-seed').textContent:raw);if(!Array.isArray(data)||!data.every(valid)||new Set(data.map(w=>w.id)).size!==data.length)throw Error();words=data;}catch(e){storageOK=false;warn('无法读取存储，原数据未覆盖。');}}
function eligible(w){return !w.mastered&&w.due<=Date.now();}
function ensureDay(){
 const day=localDay();if(dailyPlan?.day===day&&session?.day===day)return;
 reviewHistory.length=0;currentId=null;flipped=false;pendingGrade=null;dailyPlan={day,ids:[]};session={day,count:0,pending:[]};
 try{const p=JSON.parse(localStorage.getItem(PLAN_KEY));if(p?.day===day&&Array.isArray(p.ids)&&p.ids.length<=140&&p.ids.every(id=>typeof id==='string')&&new Set(p.ids).size===p.ids.length)dailyPlan=p;}catch(e){}
 try{const q=JSON.parse(localStorage.getItem(SESSION_KEY));if(q?.day===day&&Number.isSafeInteger(q.count)&&q.count>=0&&Array.isArray(q.pending)&&q.pending.every(p=>typeof p.id==='string'&&Number.isSafeInteger(p.readyAt)&&p.readyAt>=0)&&new Set(q.pending.map(p=>p.id)).size===q.pending.length)session=q;}catch(e){}
}
function studied(w){return Boolean(w.lastReviewedAt||w.reviewCount>0||w.stage>0||w.reinforcement||w.mastered||session?.pending.some(p=>p.id===w.id));}
function todayWords(){
 ensureDay();const byId=new Map(words.map(w=>[w.id,w]));
 const existing=dailyPlan.ids.map(id=>byId.get(id)).filter(Boolean);
 const consumed=existing.filter(w=>w.lastReviewedDay===localDay()||!eligible(w)||session.pending.some(p=>p.id===w.id));
 const consumedIds=new Set(consumed.map(w=>w.id));
 const retained=existing.filter(w=>!consumedIds.has(w.id)).slice(0,Math.max(0,dailyLimit-consumed.length));
 const active=[...consumed,...retained],ids=new Set(active.map(w=>w.id));
 const additions=words.filter(w=>eligible(w)&&!ids.has(w.id)).sort((a,b)=>Number(studied(b))-Number(studied(a))||a.due-b.due||a.created-b.created||a.id.localeCompare(b.id)).slice(0,Math.max(0,dailyLimit-active.length));
 const admitted=new Set(dailyPlan.ids);for(const w of additions)if(!admitted.has(w.id)){dailyPlan.ids.push(w.id);admitted.add(w.id);}
 if(additions.length)persist(PLAN_KEY,dailyPlan);
 const selectedIds=new Set([...active,...additions].map(w=>w.id));
 return dailyPlan.ids.filter(id=>selectedIds.has(id)).map(id=>byId.get(id)).filter(Boolean);
}
function queueWords(){
 const today=todayWords(),byId=new Map(today.map(w=>[w.id,w]));
 const held=new Set(session.pending.map(p=>p.id));
 const repeats=session.pending.filter(p=>p.readyAt<=session.count&&byId.has(p.id)&&!byId.get(p.id).mastered).sort((a,b)=>a.readyAt-b.readyAt).map(p=>byId.get(p.id));
 return [...repeats,...today.filter(w=>eligible(w)&&!held.has(w.id)).sort((a,b)=>a.due-b.due||a.created-b.created)];
}
function cleanGroup(value){return String(value||'').split(/\s*[·,，|/]\s*/).map(t=>t.trim()).filter(t=>t&&!/^(?:必备|必背)(?:词汇|词组|单词)?$/.test(t)).join(' · ');}
function groupName(w){return [w.unit,w.group,w.category,w.tags.join(' · ')].map(cleanGroup).find(Boolean)||'未分组';}
function groupRows(items,target,actions=false){
 target.replaceChildren();if(!items.length){target.append(element('div','empty','暂无词条'));return;}
 const groups=new Map();for(const w of items){const name=groupName(w);if(!groups.has(name))groups.set(name,[]);groups.get(name).push(w);}
 for(const [name,entries] of groups){const box=element('section','group-box'),heading=element('div','group-heading');heading.append(element('h3','',name),element('span','group-count',entries.length+' 词'));box.append(heading);
  for(const w of entries){const row=element('div','group-row'),en=element('div','english');en.append(element('span','',w.word));
   if(actions){const controls=element('span','row-actions');if(w.mastered){const retry=element('button','','↻');retry.type='button';retry.title='重新加入复习';retry.setAttribute('aria-label','重新复习 '+w.word);retry.onclick=()=>{w.mastered=false;w.scheduleVersion=2;w.stage=0;w.due=Date.now();delete w.reinforcement;session.pending=session.pending.filter(p=>p.id!==w.id);save();persist(SESSION_KEY,session);render();};controls.append(element('span','mastered','熟记'),retry);}
    const del=element('button','','×');del.type='button';del.setAttribute('aria-label','删除 '+w.word);del.onclick=()=>{if(confirm('删除 '+w.word+'？')){words=words.filter(item=>item.id!==w.id);session.pending=session.pending.filter(p=>p.id!==w.id);save();persist(SESSION_KEY,session);render();}};controls.append(del);en.append(controls);}
   row.append(element('div','',w.definition),en);box.append(row);
  }target.append(box);
 }
}
function visibleQueue(){return queueWords().filter(w=>direction==='zh-en'?!studied(w):direction==='review'?studied(w):true);}
function renderCard(){
 const queue=visibleQueue(),preview=direction==='en-zh',library=direction==='library',cardMode=!preview&&!library;
 for(const [id,value] of [['en-zh','en-zh'],['zh-en','zh-en'],['tab-review','review'],['tab-library','library']])$(id).setAttribute('aria-pressed',String(direction===value));
 $('module-title').textContent={'en-zh':'今日预览','zh-en':'学习','review':'复习','library':'词库'}[direction];
 $('limit-control').hidden=!preview;$('library-view').hidden=!library;$('today-preview').hidden=!preview;$('card').hidden=!cardMode;$('score-panel').hidden=!cardMode;
 const layout=document.querySelector('.layout');layout.classList.toggle('is-preview',preview);layout.classList.toggle('is-list',!cardMode);
 let w=queue.find(w=>w.id===currentId);if(!w){w=queue[0];currentId=w?.id||null;flipped=false;pendingGrade=null;}
 $('review-count').textContent=library?words.length+' 词':`${todayWords().length} / ${dailyLimit}`;
 const held=session.pending.filter(p=>words.some(w=>w.id===p.id)),waiting=held.filter(p=>p.readyAt>session.count);
 $('queue-status').textContent=queue.length?`待${direction==='zh-en'?'学习':'复习'} ${queue.length} · 待重现 ${held.length}`:direction==='review'&&waiting.length?`待重现 ${waiting.length} · 还需 ${Math.min(...waiting.map(p=>p.readyAt-session.count))} 个其他词`:'本轮完成';
 $('undo-review').hidden=false;$('undo-review').disabled=!cardMode||!reviewHistory.length;
 document.querySelectorAll('[data-grade]').forEach(b=>b.disabled=!cardMode||!w);
 document.querySelector('[data-grade=good]').textContent=flipped?'下一词':'记得';document.querySelector('[data-grade=again]').textContent=flipped?'记错了':'不记得';
 if(preview){groupRows(todayWords(),$('today-list'));return;}if(library)return;
 const content=$('card-content');content.replaceChildren();$('card').disabled=!w;
 if(!w){content.append(element('div','card-definition',direction==='review'&&waiting.length?'等待重现':'本轮完成'));return;}
 content.append(element('div',flipped?'card-word':'card-definition',flipped?w.word:w.definition));
 if(flipped&&w.examples?.length){const ex=element('div','examples');w.examples.forEach(t=>ex.append(element('div','',t)));if(w.dictionarySource)ex.append(dictionaryCredit(w.word));content.append(ex);}
 $('card').setAttribute('aria-label',flipped?'英文答案':'中文题面');
}
function renderList(){const query=$('search').value.trim().toLocaleLowerCase();const filtered=words.filter(w=>[w.word,w.definition,groupName(w)].join(' ').toLocaleLowerCase().includes(query));$('shown').textContent=filtered.length+' 词';groupRows(filtered,$('list'),true);}
function render(){todayWords();$('total').textContent=words.length;$('due-count').textContent=queueWords().length;$('learned').textContent=words.filter(w=>w.mastered).length;renderCard();renderList();}
function setDirection(value){direction=value;flipped=false;pendingGrade=null;try{localStorage.setItem('wordwell.module',value);}catch(e){}renderCard();}
$('en-zh').onclick=()=>setDirection('en-zh');$('zh-en').onclick=()=>setDirection('zh-en');$('tab-review').onclick=()=>setDirection('review');$('tab-library').onclick=()=>setDirection('library');

function normalizeSchedule(w){if(w.scheduleVersion===2)return;w.stage=[0,1,2,4,4,6,8,9][Math.min(7,w.stage)];w.scheduleVersion=2;}
function advanceNormal(w){if(w.stage>=INTERVALS.length){w.mastered=true;w.due=0;return;}w.due=calendarDays(Date.now(),INTERVALS[w.stage]);w.stage++;}
function gradeWord(grade){
 ensureDay();const queue=queueWords(),w=queue.find(item=>item.id===currentId);if(!w||!flipped||!['zh-en','review'].includes(direction))return;
 const before=clone(w),previousSession=clone(session),repeat=session.pending.some(p=>p.id===w.id);
 normalizeSchedule(w);w.lastReviewedAt=Date.now();w.lastReviewedDay=localDay();w.reviewCount=(Number(w.reviewCount)||0)+1;w.mastered=false;session.count++;session.pending=session.pending.filter(p=>p.id!==w.id);
 if(grade==='again'){
  w.reinforcement={anchor:midnight(),step:0};w.due=calendarDays(w.reinforcement.anchor,1);
  session.pending.push({id:w.id,readyAt:session.count+10});
 }else if(!repeat){
  if(w.reinforcement){
   if(w.reinforcement.step<2){w.reinforcement.step++;w.due=calendarDays(w.reinforcement.anchor,[1,3,5][w.reinforcement.step]);}
   else{delete w.reinforcement;advanceNormal(w);}
  }else advanceNormal(w);
 }
 reviewHistory.push({before,after:JSON.stringify(w),session:previousSession});save();persist(SESSION_KEY,session);currentId=null;flipped=false;pendingGrade=null;render();
}
document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{
 if(!['zh-en','review'].includes(direction)||!visibleQueue().some(w=>w.id===currentId))return;
 if(!flipped){pendingGrade=b.dataset.grade;flipped=true;renderCard();return;}
 gradeWord(b.dataset.grade==='again'?'again':pendingGrade||'again');
});
$('undo-review').onclick=()=>{
 ensureDay();const prev=reviewHistory.pop();if(!prev)return;const i=words.findIndex(w=>w.id===prev.before.id);
 if(i<0||JSON.stringify(words[i])!==prev.after){render();toast('词条已变更，未覆盖');return;}
 words[i]=prev.before;session=prev.session;direction=studied(prev.before)?'review':'zh-en';try{localStorage.setItem('wordwell.module',direction);}catch(e){}save();persist(SESSION_KEY,session);currentId=prev.before.id;flipped=false;pendingGrade=null;render();
};
$('search').oninput=renderList;
$('single-import').onclick=()=>$('single-dialog').showModal();$('single-close').onclick=()=>$('single-dialog').close();
function newWord(word,definition,tags=[]){const now=Date.now();return {id:crypto.randomUUID?crypto.randomUUID():now+'-'+Math.random().toString(36).slice(2),word,definition,tags,stage:0,due:now,created:now,scheduleVersion:2};}
function parseBatch(text){
 let parsed;try{parsed=JSON.parse(text);}catch(e){if(/^[\s]*[\[{]/.test(text))throw Error('JSON 格式错误');}
 if(parsed!==undefined){if(Array.isArray(parsed)&&parsed.every(w=>typeof w.word==='string'&&typeof w.definition==='string'&&!w.id)){return {version:1,words:parsed.map(w=>({...newWord(w.word,w.definition,w.tags||[]),...w}))};}return parsed;}
 const lines=text.trim().split(/\r?\n/).filter(line=>line.trim());if(!lines.length)throw Error('内容为空');
 const tags=$('bulk-unit').value.trim()?[$('bulk-unit').value.trim()]:[];
 const entries=lines.map((line,i)=>{let parts=line.split('\t');if(parts.length<2)parts=line.split(/\s*[|｜]\s*|\s{2,}/);if(parts.length<2)parts=line.split(',');if(parts.length<2)throw Error('第 '+(i+1)+' 行缺少中英文列');let [first,...rest]=parts;let second=rest.join(' ').trim();first=first.trim();return /[\u3400-\u9fff]/.test(first)&&!/[\u3400-\u9fff]/.test(second)?newWord(second,first,[...tags]):newWord(first,second,[...tags]);});return {version:1,words:entries};
}
function download(data,type,name){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
let lookupSource=false,lookupController=null,lookupSequence=0;
const lookupCache=new Map();
function dictionaryCredit(word){
  const credit=element('div','lookup-credit');
  for(const [label,url] of [['Free Dictionary API','https://dictionaryapi.dev/'],['Wiktionary','https://en.wiktionary.org/wiki/'+encodeURIComponent(word)],['CC BY-SA 3.0','https://creativecommons.org/licenses/by-sa/3.0/']]){
    const a=element('a','',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';credit.append(a,document.createTextNode(' · '));
  }return credit;
}
function clearLookup(){
  lookupSequence++;lookupController?.abort();lookupSource=false;
  $('lookup-status').textContent='';$('lookup-preview').replaceChildren();$('example-credit').hidden=true;
  $('lookup').disabled=false;$('lookup').textContent='查释义与例句';$('add-form').querySelector('[type="submit"]').disabled=false;
}
$('word').addEventListener('input',clearLookup);
async function lookupJSON(url,signal){const r=await fetch(url,{signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('服务暂不可用');return r.json();}
$('lookup').onclick=async()=>{
  const word=$('word').value.trim();if(!word){$('lookup-status').textContent='请输入英文';$('word').focus();return;}
  if(!/[a-z]/i.test(word)){ $('lookup-status').textContent='请输入英文';return;}
  const token=++lookupSequence;lookupController?.abort();const controller=new AbortController();lookupController=controller;
  const originalDefinition=$('definition').value,originalExamples=$('examples').value;
  $('lookup').disabled=true;$('lookup').textContent='正在查询…';$('add-form').querySelector('[type="submit"]').disabled=true;
  $('lookup-status').textContent='正在查中文释义和词典例句…';$('lookup-preview').replaceChildren();
  const timeout=setTimeout(()=>controller.abort(),15000);
  try{
    let result=lookupCache.get(word.toLowerCase());
    if(!result){
      const [dictionary,translation]=await Promise.allSettled([
        lookupJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word.toLowerCase()),controller.signal),
        lookupJSON('https://api.mymemory.translated.net/get?'+new URLSearchParams({q:word,langpair:'en|zh-CN'}),controller.signal)
      ]);
      const entries=dictionary.status==='fulfilled'&&Array.isArray(dictionary.value)?dictionary.value:[];
      const definitions=entries.flatMap(e=>Array.isArray(e.meanings)?e.meanings:[]).flatMap(m=>Array.isArray(m.definitions)?m.definitions:[]);
      const meanings=[...new Set(definitions.map(d=>d.definition).filter(t=>typeof t==='string'))].slice(0,3);
      const examples=[...new Set(definitions.map(d=>d.example).filter(t=>typeof t==='string'))].slice(0,2);
      const tr=translation.status==='fulfilled'?translation.value:null;
      const chinese=Number(tr?.responseStatus)===200&&typeof tr?.responseData?.translatedText==='string'&&/[\u3400-\u9fff]/.test(tr.responseData.translatedText)?tr.responseData.translatedText.trim():'';
      result={chinese,meanings,examples};if(chinese&&meanings.length)lookupCache.set(word.toLowerCase(),result);
    }
    if(token!==lookupSequence)return;
    if(result.chinese&&$('definition').value===originalDefinition)$('definition').value=result.chinese.slice(0,2000);
    if(result.examples.length&&$('examples').value===originalExamples){$('examples').value=result.examples.join('\n').slice(0,4000);lookupSource=true;}
    const preview=$('lookup-preview');
    if(result.meanings.length){preview.append(element('strong','','词典英文释义（帮助区分语境）'));const list=element('ol');result.meanings.forEach(t=>list.append(element('li','',t)));preview.append(list,dictionaryCredit(word));}
    $('example-credit').hidden=!lookupSource;
    const notes=[];notes.push(result.chinese?'中文已填入':'翻译暂不可用');
    notes.push(result.examples.length?'例句已填入':'暂无例句');
    $('lookup-status').textContent=notes.join('\n');
  }catch(e){if(token===lookupSequence)$('lookup-status').textContent='查询失败';}
  finally{clearTimeout(timeout);if(token===lookupSequence){$('lookup').disabled=false;$('lookup').textContent='⌕ 重新查询';$('add-form').querySelector('[type="submit"]').disabled=false;}}
};

function backupStatus(message){$('backup-status').textContent=message;}
function openBackup(mode){
  const exporting=mode==='export';
  $('backup-title').textContent=exporting?'导出':'批量导入';
  $('bulk-unit-area').hidden=exporting;
  $('backup-file-area').hidden=exporting;
  $('backup-download').hidden=!exporting;
  $('backup-copy').hidden=!exporting;
  $('backup-merge').hidden=exporting;
  $('backup-text').readOnly=exporting;
  $('backup-text').value=exporting?JSON.stringify({version:1,words},null,2):'';
  $('backup-file').value='';
  backupStatus(exporting?`已生成 ${words.length} 个单词的备份。`:'');
  if(backupURL){URL.revokeObjectURL(backupURL);backupURL=null;}
  if(exporting){backupURL=URL.createObjectURL(new Blob([$('backup-text').value],{type:'application/json'}));$('backup-download').href=backupURL;}
  $('backup-dialog').showModal();
}
$('export').onclick=()=>openBackup('export');
$('import').onclick=()=>openBackup('import');
$('backup-close').onclick=()=>$('backup-dialog').close();
$('backup-dialog').addEventListener('close',()=>{if(backupURL){URL.revokeObjectURL(backupURL);backupURL=null;}});
$('backup-download').onclick=()=>backupStatus('已请求下载');
$('backup-copy').onclick=async()=>{
  try{await navigator.clipboard.writeText($('backup-text').value);backupStatus('已复制');}
  catch(e){$('backup-text').focus();$('backup-text').select();$('backup-text').setSelectionRange(0,$('backup-text').value.length);backupStatus('已全选，请手动复制');}
};
$('backup-file').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{if(file.size>5*1024*1024)throw Error('备份文件超过 5 MB。');$('backup-text').value=await file.text();backupStatus('文件已读取');}
  catch(error){backupStatus(error.message);}
};
$('backup-merge').onclick=()=>{
  try{
    const text=$('backup-text').value;if(new Blob([text]).size>5*1024*1024)throw Error('备份内容超过 5 MB。');
    const data=parseBatch(text);
    if(!data||data.version!==1||!Array.isArray(data.words)||!data.words.every(valid)||new Set(data.words.map(w=>w.id)).size!==data.words.length)throw Error('这不是有效的 Wordwell 备份，原有单词未改动。');
    const names=new Set(words.map(w=>w.word.toLocaleLowerCase())),ids=new Set(words.map(w=>w.id));let count=0;
    for(const source of data.words){const w={...source,tags:[...source.tags]};if(names.has(w.word.toLocaleLowerCase()))continue;if(ids.has(w.id))w.id=`${Date.now()}-${Math.random().toString(36).slice(2)}`;words.push(w);names.add(w.word.toLocaleLowerCase());ids.add(w.id);count++;}
    const saved=save();render();backupStatus(`已导入 ${count} 个单词，跳过 ${data.words.length-count} 个同名单词。`+(saved?'已保存到此设备。':'当前仅保留在本次会话，请立即导出备份。'));toast(`已导入 ${count} 个单词。`);
  }catch(error){backupStatus(error.message);}
};

$('add-form').addEventListener('submit',e=>{e.preventDefault();const word=$('word').value.trim(),definition=$('definition').value.trim();if(!word||!definition)return;if(words.some(w=>w.word.toLocaleLowerCase()===word.toLocaleLowerCase())){toast('单词已存在');return;}const w=newWord(word,definition,[...new Set($('tags').value.split(',').map(t=>t.trim()).filter(Boolean))].slice(0,20));w.examples=$('examples').value.split('\n').map(t=>t.trim()).filter(Boolean).slice(0,10);w.dictionarySource=lookupSource;words.push(w);save();e.target.reset();clearLookup();render();$('single-dialog').close();});
window.addEventListener('storage',e=>{if([KEY,PLAN_KEY,SESSION_KEY,'wordwell.daily-limit',null].includes(e.key)){dailyPlan=null;session=null;try{const limit=Number(localStorage.getItem('wordwell.daily-limit'));if([100,120,140].includes(limit)){dailyLimit=limit;$('daily-limit').value=String(limit);}}catch(e){}read();render();}});
function refresh(){read();render();}
window.addEventListener('pageshow',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});setInterval(render,60000);
read();render();
</script></body></html>
